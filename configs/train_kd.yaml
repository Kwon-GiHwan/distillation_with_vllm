student_model: "Qwen/Qwen2.5-0.5B-Instruct"
data_path: "data/distilled/alpaca_llama32_3b.jsonl"

# 손실 가중치/온도
alpha_kd: 0.1         # KL 가중치 (0.05~0.3 사이 탐색 추천)
temperature: 1.0      # KD 온도 (1.0~2.0)

# 토크나이즈/학습
max_len: 1024
batch_size: 6
grad_accum: 3
epochs: 2
lr: 2e-5
scheduler: cosine
warmup: 0.03
logging_steps: 50
save_steps: 1000

out_dir: "artifacts/qwen05b_kd"
final_dir: "artifacts/qwen05b_kd/final"
